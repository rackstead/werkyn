services:
  werkyn:
    container_name: werkyn-app
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/projectapp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random secret}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env to a separate random secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: lax
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_DIR: /app/storage
      DEX_STORAGE_TYPE: postgres
      DEX_CONFIG_DIR: /app/data/dex
    volumes:
      - werkyn-storage:/app/storage
      - werkyn-dex-data:/app/data/dex

  postgres:
    container_name: werkyn-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: projectapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d projectapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  werkyn-storage:
  werkyn-dex-data:
